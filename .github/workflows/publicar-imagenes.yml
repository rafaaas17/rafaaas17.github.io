# Construye y publica las dos imágenes del perfil en GHCR.
#
# Se hace desde Actions y no desde mi máquina a propósito: así la imagen que
# está publicada es exactamente la que sale de este repositorio, construida en
# un entorno limpio, y no la que había en mi disco el día que hice docker push.

name: Publicar imágenes en GHCR

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "index.html"
      - "estilos.css"
      - "libro-de-visitas.js"
      - ".github/workflows/publicar-imagenes.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Construir y publicar
    runs-on: ubuntu-24.04

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN, no un token personal: vive lo que dura el job y solo
      # puede escribir en los paquetes de este repositorio.
      - name: Entrar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: perfil-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/perfil-web:1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: perfil-api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/perfil-api:1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

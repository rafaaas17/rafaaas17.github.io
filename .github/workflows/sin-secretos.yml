# Reto 6: que el repositorio siga sin credenciales, no solo hoy.
#
# Revisar a mano que .env no está commiteado funciona una vez. Esto lo revisa
# en cada pull request, que es cuando todavía se puede arreglar.

name: Sin secretos

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar que no hay credenciales versionadas
    runs-on: ubuntu-24.04

    steps:
      - name: Clonar el repositorio con todo el historial
        uses: actions/checkout@v4
        with:
          # Sin esto el checkout es superficial y --full-history no ve nada.
          fetch-depth: 0

      - name: .env nunca estuvo en el historial
        run: |
          if git log --all --full-history --oneline -- .env | grep .; then
            echo "::error::.env aparece en el historial de Git"
            exit 1
          fi
          echo "OK: .env nunca estuvo versionado."

      - name: .env está ignorado y existe la plantilla
        run: |
          test -f .env.example
          : > .env
          git check-ignore -q .env
          rm -f .env
          echo "OK: .env está en .gitignore y .env.example sí se versiona."

      - name: Ningún archivo versionado trae una contraseña real
        run: |
          if git grep -nEI 'POSTGRES_PASSWORD=[^[:space:]]+' -- . ':!.env.example' | grep -v '\${'; then
            echo "::error::hay una contraseña escrita en un archivo versionado"
            exit 1
          fi
          echo "OK: la única mención con valor está en .env.example, y es una plantilla."

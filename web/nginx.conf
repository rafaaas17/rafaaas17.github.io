# Configuración del servidor web del perfil.
#
# nginx hace dos cosas: sirve los archivos estáticos del perfil y reenvía a la
# API todo lo que llegue a /api/. Por eso el JavaScript del libro de visitas
# puede llamar a "/api/mensajes" sin dominio ni puerto: para el navegador la
# API vive en el mismo origen que la página, y quien sabe que detrás hay otro
# contenedor es nginx, no el frontend.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # El perfil: archivos estáticos.
    location / {
        try_files $uri $uri/ =404;
    }

    # El libro de visitas.
    #
    # proxy_pass SIN barra final a propósito: así nginx reenvía la URI completa
    # y el backend recibe /api/mensajes, que es la ruta que registra. Si
    # escribiera "http://api:3000/" nginx quitaría el prefijo /api/ y el
    # backend respondería 404 a todo.
    location /api/ {
        proxy_pass http://api:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si la API tarda, mejor un error rápido que un navegador colgado.
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }
}

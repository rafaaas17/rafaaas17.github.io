# Configuración del servidor web del perfil.
#
# nginx hace dos cosas: sirve los archivos estáticos del perfil y reenvía a la
# API todo lo que llegue a /api/. Por eso el JavaScript del libro de visitas
# puede llamar a "/api/mensajes" sin dominio ni puerto: para el navegador la
# API vive en el mismo origen que la página, y quien sabe que detrás hay otro
# contenedor es nginx, no el frontend.

server {
    # 8080 y no 80: este nginx corre como el usuario nginx, sin privilegios,
    # y los puertos por debajo de 1024 están reservados a root.
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Reto 2: punto de salud propio de nginx. No toca disco ni la API: solo
    # responde si nginx está en pie y sirviendo. Que web esté sano no significa
    # que la API lo esté, y está bien que sean dos preguntas distintas.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok
";
    }

    # El perfil: archivos estáticos.
    location / {
        try_files $uri $uri/ =404;
    }

    # El libro de visitas.
    #
    # proxy_pass SIN barra final a propósito: así nginx reenvía la URI completa
    # y el backend recibe /api/mensajes, que es la ruta que registra. Si
    # escribiera "http://api:3000/" nginx quitaría el prefijo /api/ y el
    # backend respondería 404 a todo.
    location /api/ {
        proxy_pass http://api:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si la API tarda, mejor un error rápido que un navegador colgado.
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }
}
